name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
  streamlit-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv pip install --system -r app/requirements.txt
      - run: python -m pip check
      - name: Verify bundled inference and dashboard
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path

          from PIL import Image
          from streamlit.testing.v1 import AppTest

          from crop_disease.predict import load_model, predict_image

          image = BytesIO()
          Image.new("RGB", (128, 128), (70, 130, 45)).save(image, format="PNG")
          result = predict_image(load_model(Path("models/demo")), image.getvalue())
          assert result["label"] in {"Healthy", "Diseased"}
          app = AppTest.from_file("app/streamlit_app.py", default_timeout=30).run()
          assert not app.exception and len(app.selectbox) == 1
          PY
